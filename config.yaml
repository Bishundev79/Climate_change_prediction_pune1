project:
  name: "Climate Change Prediction — Pune, Maharashtra"
  version: "2.0.0"
  author: "Climate Intelligence Team"

data:
  file_path: "data/pune_climate_with_co2.csv"
  target: "temp_C"
  date_col: "date"
  features:
    - temp_C
    - humidity_pct
    - rainfall_mm
    - solar_MJ
    - co2_ppm

training:
  test_size: 0.15             # fraction of data for test split
  val_size: 0.15              # fraction of data for validation split
  random_state: 42
  lookback: 24                # months of history for DL sequence input
  batch_size: 32
  epochs: 200
  patience: 25                # early stopping patience (epochs)
  lag_features: [1, 6, 12]    # lag offsets in months
  rolling_windows: [3, 6, 12] # rolling-mean window sizes in months

# ── Model hyperparameters ──────────────────────────────────────────────────
# These values are read by src/ml_models.py and src/dl_models.py at
# construction time.  Change them here—no code edits required.
models:
  xgboost:
    n_estimators: 500
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.8

  random_forest:
    n_estimators: 400
    max_depth: 15
    min_samples_leaf: 2

  cnn_lstm:
    cnn_filters: [64, 128, 64]
    lstm_units: [128, 64]

  transformer:
    d_model: 128
    num_heads: 8
    num_layers: 4
    dff: 512
    dropout: 0.2
